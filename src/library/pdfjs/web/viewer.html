        <script id="kiosk-pre">
            (function () {
                "use strict";
                function applyOptions(e) {
                    var w = (e && e.detail && e.detail.source) || window;
                    var o = w.PDFViewerApplicationOptions || window.PDFViewerApplicationOptions;
                    if (!o || !o.set) return;
                    var opts = {
                        annotationEditorMode: -1,
                        enableHighlightFloatingButton: false,
                        enableComment: false,
                        enableSignatureEditor: false,
                        enableAltText: false,
                        enableScripting: false,
                        disableHistory: true,
                        defaultZoomValue: "page-fit",
                        scrollModeOnLoad: 1,   // 1 = horizontal scrolling
                        spreadModeOnLoad: 1    // 1 = two-page spreads (pages 1-2, 3-4, ...); use 2 if page 1 is a cover
                    };
                    Object.keys(opts).forEach(function (k) { try { o.set(k, opts[k]); } catch (err) { } });
                }
                document.addEventListener("webviewerloaded", applyOptions);
                try { if (parent !== window) parent.document.addEventListener("webviewerloaded", applyOptions); } catch (err) { }

                window.addEventListener("keydown", function (e) {
                    var k = (e.key || "").toLowerCase();
                    if ((e.ctrlKey || e.metaKey) && (k === "p" || k === "s" || k === "o")) {
                        e.preventDefault(); e.stopImmediatePropagation();
                    }
                }, true);
                window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
                window.addEventListener("dragover", function (e) { e.preventDefault(); });
                window.addEventListener("drop", function (e) { e.preventDefault(); });
            })();
        </script>

                                                aria-hidden="true"></button>

                <dialog id="printServiceDialog" style="min-width: 200px">

        <!-- ===== KIOSK: menu button, pager, modal ===== -->
        <button id="kioskMenuBtn" type="button" aria-haspopup="dialog" aria-controls="kioskModal">&#8981;
            Search</button>

        <div id="kioskPager" role="group" aria-label="Page navigation">
            <input id="kPage" type="number" min="1" inputmode="numeric" aria-label="Page number" value="1" />
            <span id="kPages" aria-live="polite">/ &ndash;</span>
        </div>
        <button id="kioskPrev" class="kioskNav" type="button" data-act="prev"
            aria-label="Previous page">&#8249;</button>
        <button id="kioskNext" class="kioskNav" type="button" data-act="next" aria-label="Next page">&#8250;</button>

        <div id="kioskModal" role="dialog" aria-modal="true" aria-labelledby="kTitle">
            <div id="kioskPanel">
                <header>
                    <h2 id="kTitle">Search</h2><button type="button" data-act="close"
                        aria-label="Close">&#10005;</button>
                </header>

                <section>
                    <div class="krow">
                        <input id="kFind" type="search" placeholder="Search the document"
                            aria-label="Search the document" autocomplete="off" />
                        <button type="button" data-act="findprev" aria-label="Previous match">&#8593;</button>
                        <button type="button" data-act="findnext" aria-label="Next match">&#8595;</button>
                    </div>
                    <div id="kFindInfo" aria-live="polite"></div>
                </section>

                <section hidden>
                    <h3>Zoom</h3>
                    <div class="krow">
                        <button type="button" data-proxy="zoomOutButton" aria-label="Zoom out">&minus;</button>
                        <button type="button" data-proxy="zoomInButton" aria-label="Zoom in">+</button>
                        <select id="kScale" aria-label="Zoom level">
                            <option value="auto">Automatic zoom</option>
                            <option value="page-actual">Actual size</option>
                            <option value="page-fit">Page fit</option>
                            <option value="page-width">Page width</option>
                            <option value="custom" id="kCustom" hidden disabled>100%</option>
                            <option value="0.5">50%</option>
                            <option value="0.75">75%</option>
                            <option value="1">100%</option>
                            <option value="1.25">125%</option>
                            <option value="1.5">150%</option>
                            <option value="2">200%</option>
                            <option value="3">300%</option>
                            <option value="4">400%</option>
                        </select>
                    </div>
                    <h3>Go to</h3>
                    <div class="krow">
                        <button type="button" data-proxy="firstPage">First page</button>
                        <button type="button" data-proxy="lastPage">Last page</button>
                        <button type="button" data-proxy="pageRotateCcw">Rotate &#8634;</button>
                        <button type="button" data-proxy="pageRotateCw">Rotate &#8635;</button>
                    </div>
                </section>
            </div>
        </div>

        <script id="kiosk-main">
            (function () {
                "use strict";
                var IDLE_MS = 3 * 60 * 1000;
                var app = null;
                var $ = function (id) { return document.getElementById(id); };
                var modal = $("kioskModal"), pageIn = $("kPage"), pagesLbl = $("kPages"),
                    scaleSel = $("kScale"), findIn = $("kFind"), findInfo = $("kFindInfo");

                function openModal() { sync(); modal.classList.add("open"); }
                function closeModal() { modal.classList.remove("open"); }
                function sync() {
                    [].forEach.call(modal.querySelectorAll("[role=radio][data-proxy]"), function (b) {
                        var o = $(b.getAttribute("data-proxy"));
                        b.setAttribute("aria-checked", o && o.getAttribute("aria-checked") === "true" ? "true" : "false");
                    });
                }
                function pages() { return (app && app.pagesCount) || 0; }
                function goTo(n) {
                    if (!app || !pages()) return;
                    n = Math.min(Math.max(parseInt(n, 10) || 1, 1), pages());
                    app.pdfViewer.currentPageNumber = n;
                }
                // First page of the spread that contains page p (spread mode 0 = none, 1 = odd, 2 = even).
                function spreadStart(p) {
                    var mode = app.pdfViewer.spreadMode;
                    return mode === 1 ? p - ((p - 1) % 2) : mode === 2 ? (p < 2 ? 1 : p - (p % 2)) : p;
                }
                // Previous / next move one spread (two pages) at a time.
                function step(dir) {
                    if (!app || !pages()) return;
                    var mode = app.pdfViewer.spreadMode, start = spreadStart(app.page), n;
                    if (dir > 0) n = (mode === 2 && start === 1) ? 2 : start + (mode ? 2 : 1);
                    else n = (mode === 2 && start === 2) ? 1 : start - (mode ? 2 : 1);
                    goTo(n);   // goTo clamps to the first / last page
                }
                function find(type, back) {
                    if (!app) return;
                    app.eventBus.dispatch("find", {
                        source: window, type: type, query: findIn.value, caseSensitive: false, entireWord: false,
                        highlightAll: true, findPrevious: !!back, matchDiacritics: true
                    });
                }
                function refreshPager() {
                    if (!app) return;
                    pageIn.value = app.page || 1;
                    pageIn.max = pages() || "";
                    pagesLbl.textContent = "/ " + (pages() || "\u2013");
                }

                $("kioskMenuBtn").addEventListener("click", openModal);
                modal.addEventListener("click", function (e) {
                    if (e.target === modal) { closeModal(); return; }
                    var p = e.target.closest("[data-proxy]");
                    if (p) {
                        var o = $(p.getAttribute("data-proxy"));
                        if (o && !o.disabled) o.click();
                        sync(); setTimeout(sync, 120);
                        if (p.getAttribute("data-close")) closeModal();
                    }
                });
                document.addEventListener("click", function (e) {
                    var a = e.target.closest && e.target.closest("[data-act]");
                    if (!a) return;
                    var act = a.getAttribute("data-act");
                    if (act === "close") closeModal();
                    else if (act === "prev") step(-1);
                    else if (act === "next") step(1);
                    else if (act === "findnext") find("again", false);
                    else if (act === "findprev") find("again", true);
                });
                pageIn.addEventListener("change", function () { goTo(pageIn.value); refreshPager(); });
                pageIn.addEventListener("keydown", function (e) { if (e.key === "Enter") { goTo(pageIn.value); pageIn.blur(); } });
                findIn.addEventListener("input", function () { find("", false); if (!findIn.value) findInfo.textContent = ""; });
                findIn.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); find("again", e.shiftKey); } });
                scaleSel.addEventListener("change", function () { if (app) app.pdfViewer.currentScaleValue = scaleSel.value; });

                window.addEventListener("wheel", function (e) {
                    if (e.ctrlKey || e.metaKey) { e.preventDefault(); e.stopImmediatePropagation(); }
                }, { capture: true, passive: false });
                window.addEventListener("touchmove", function (e) {
                    if (e.touches && e.touches.length > 1) { e.preventDefault(); e.stopImmediatePropagation(); }
                }, { capture: true, passive: false });
                window.addEventListener("keydown", function (e) {
                    if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "_", "0"].indexOf(e.key) !== -1) {
                        e.preventDefault(); e.stopImmediatePropagation();
                    }
                }, true);

                window.addEventListener("keydown", function (e) {
                    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
                    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
                    var t = e.target, tag = t && t.tagName;
                    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
                    e.preventDefault(); e.stopImmediatePropagation();
                    armIdle(); if (!app || modal.classList.contains("open") || document.querySelector("dialog[open]")) return;
                    step(e.key === "ArrowRight" ? 1 : -1);
                }, true);

                window.addEventListener("keydown", function (e) {
                    var k = (e.key || "").toLowerCase();
                    if ((e.ctrlKey || e.metaKey) && k === "f") {
                        e.preventDefault(); e.stopImmediatePropagation(); openModal(); findIn.focus(); findIn.select();
                    } else if (k === "escape" && modal.classList.contains("open")) { closeModal(); }
                }, true);

                var idle;
                function armIdle() {
                    clearTimeout(idle); idle = setTimeout(function () {
                        closeModal();
                        if (!app || !pages()) return;
                        try {
                            findIn.value = ""; find("", false); findInfo.textContent = "";
                            app.pdfViewer.currentScaleValue = "page-fit"; app.pdfViewer.currentPageNumber = 1;
                            app.pdfViewer.container.scrollTop = 0;
                        } catch (err) { }
                    }, IDLE_MS);
                }
                ["pointerdown", "pointermove", "keydown", "wheel", "touchstart", "scroll"].forEach(function (t) {
                    window.addEventListener(t, armIdle, { capture: true, passive: true });
                });
                armIdle();

                function init(a) {
                    app = a;
                    ["triggerPrinting", "downloadOrSave", "save", "download"].forEach(function (m) {
                        try { a[m] = function () { }; } catch (err) { }
                    });
                    var bus = a.eventBus;
                    var locking = false, target = 0;
                    function setModes() {                       // horizontal scrolling + two-page spreads
                        var v = a.pdfViewer;
                        if (v.scrollMode !== 1) v.scrollMode = 1;
                        if (v.spreadMode !== 1) v.spreadMode = 1;
                    }
                    // Size the view so exactly ONE two-page spread fills the screen: as tall as the screen allows (or as
                    // wide, on a narrow screen). The scrolling area is then made exactly one spread wide and centred, so no
                    // part of the neighbouring spread can ever be seen.
                    function fit() {
                        var v = a.pdfViewer, c = v.container, host = $("mainContainer") || document.body;
                        if (locking || !v.pdfDocument) return;
                        locking = true;
                        try {
                            c.style.scrollbarWidth = "none";             // no scrollbars: use buttons, arrow keys or swiping
                            c.style.left = c.style.right = "0px";        // measure against the full width first
                            var W = host.clientWidth, H = c.clientHeight;
                            var pd = v.getPageView(Math.min(1, v.pagesCount - 1)).div, sp, b = 0, r;
                            v.currentScaleValue = "page-height";         // sensible starting point, then refine by measuring
                            for (var i = 0; i < 4; i++) {
                                sp = pd.parentElement && pd.parentElement.classList.contains("spread") ? pd.parentElement : pd;
                                b = pd.clientLeft || 0;                  // width of the page's transparent border
                                r = sp.getBoundingClientRect();
                                var f = Math.min((H + b) / r.height, (W + 2 * b) / r.width);
                                if (Math.abs(f - 1) < 0.004) break;
                                v.currentScaleValue = String(v.currentScale * f);
                            }
                            target = v.currentScale;
                            var w = Math.min(W, Math.round(r.width - 2 * b)), side = Math.max(0, Math.round((W - w) / 2));
                            c.style.left = c.style.right = side + "px";
                            goTo(spreadStart(app.page));                 // re-align to the start of the current spread
                        } catch (err) { console.warn("fit failed:", err); }
                        locking = false;
                    }
                    bus.on("pagesinit", function () { setModes(); fit(); });
                    bus.on("pagesloaded", fit);
                    bus.on("scrollmodechanged", fit);
                    bus.on("spreadmodechanged", fit);
                    var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(fit, 150); });
                    // When any scrolling stops (swipe, search jump, drag), snap back to the start of a whole spread.
                    a.pdfViewer.container.addEventListener("scrollend", function () {
                        if (!locking && pages()) goTo(spreadStart(app.page));
                    });
                    bus.on("pagechanging", function (e) { pageIn.value = e.pageNumber; });
                    bus.on("pagesloaded", refreshPager);
                    bus.on("scalechanging", function (e) {
                        if (locking || !target) return;                          // ignore our own changes / before the first fit
                        if (Math.abs(e.scale - target) > 0.001) { fit(); return; }   // anything else changed the zoom: put it back
                        var c = $("kCustom"); c.textContent = Math.round(e.scale * 100) + "%"; c.hidden = false; scaleSel.value = "custom";
                    });
                    bus.on("updatefindmatchescount", function (e) {
                        var m = e.matchesCount || {};
                        findInfo.textContent = m.total > 0 ? m.current + " of " + m.total + " matches" : "";
                    });
                    bus.on("updatefindcontrolstate", function (e) {
                        if (e.state === 1) findInfo.textContent = "Phrase not found";
                    });
                    refreshPager();
                }
                (function wait(n) {
                    var a = window.PDFViewerApplication;
                    if (a && a.initializedPromise) a.initializedPromise.then(function () { init(a); }, function (e) { console.warn(e); });
                    else if (n < 300) setTimeout(function () { wait(n + 1); }, 50);
                })(0);
            })();
        </script>
    </body>
